name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to verify (for example v0.2.4)'
        required: false
        default: 'v0.2.4'

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-pack:
    name: Verify adapter and build release package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version: ${{ steps.meta.outputs.version }}
      revision: ${{ steps.meta.outputs.revision }}
    steps:
      - name: Check out adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release metadata and download RiffDB release bundle
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="${{ inputs.release_tag || 'v0.2.4' }}"
          fi
          [[ "$release_tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          version="${BASH_REMATCH[1]}"
          pkg_version="$(jq -r '.version' package.json)"
          [[ "$pkg_version" == "$version" ]]
          riffdb_rev="$(cat .github/riffdb-revision)"
          [[ "$riffdb_rev" =~ ^[0-9a-f]{40}$ ]]

          bundle="riffdb-${version}-x86_64-unknown-linux-gnu.tar.gz"
          base_url="https://github.com/riffdb/riffdb/releases/download/${release_tag}"
          mkdir -p "$RUNNER_TEMP/riffdb-release"
          curl -fsSL "$base_url/release-provenance-v1.json" -o "$RUNNER_TEMP/riffdb-release/release-provenance-v1.json"
          curl -fsSL "$base_url/$bundle" -o "$RUNNER_TEMP/riffdb-release/$bundle"
          expected_sha="$(jq -r '.bundle_archive.sha256' "$RUNNER_TEMP/riffdb-release/release-provenance-v1.json")"
          echo "${expected_sha}  $RUNNER_TEMP/riffdb-release/$bundle" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/riffdb-release/$bundle" -C "$RUNNER_TEMP/riffdb-release"
          bundle_dir="$RUNNER_TEMP/riffdb-release/riffdb-${version}-x86_64-unknown-linux-gnu"
          [[ "$(tr -d '\n' < "$bundle_dir/REVISION")" == "$riffdb_rev" ]]
          "$bundle_dir/bin/riffdb" application check
          (cd profiles/organization-security && "$bundle_dir/bin/riffdb" application check)
          (cd profiles/custom-fields && "$bundle_dir/bin/riffdb" application check)
          (cd profiles/runtime && "$bundle_dir/bin/riffdb" application check)

          printf 'release_tag=%s\n' "$release_tag" >>"$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$riffdb_rev" >>"$GITHUB_OUTPUT"
          printf 'binary_dir=%s\n' "$bundle_dir/bin" >>"$GITHUB_OUTPUT"
      - name: Check out exact driver-host sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: riffdb/riffdb
          ref: ${{ steps.meta.outputs.revision }}
          path: riffdb-driver-source
          persist-credentials: false
      - name: Build driver host omitted from the release bundle
        working-directory: riffdb-driver-source
        env:
          RUSTC_WRAPPER: ''
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo build --locked --release -p riffdb-driver-host --bin riffdb-driverd
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.7.0'
      - name: Run adapter test suite and pack npm tarball
        env:
          RIFFDB_CLI: ${{ steps.meta.outputs.binary_dir }}/riffdb
          RIFFDB_SERVER_BIN: ${{ steps.meta.outputs.binary_dir }}/riffdbd
          RIFFDB_DRIVERD: ${{ github.workspace }}/riffdb-driver-source/target/release/riffdb-driverd
        run: |
          npm ci --ignore-scripts
          npm run check
          npm run test:loopback
          mkdir -p "$RUNNER_TEMP/release-out"
          npm pack --pack-destination "$RUNNER_TEMP/release-out"
          (
            cd "$RUNNER_TEMP/release-out"
            sha256sum "riffdb-better-auth-${{ steps.meta.outputs.version }}.tgz" >SHA256SUMS
          )
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: riffdb-better-auth-release
          path: ${{ runner.temp }}/release-out/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release and npm package
    needs: [verify-and-pack]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: riffdb-better-auth-release
          path: release-out
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-out/riffdb-better-auth-${{ needs.verify-and-pack.outputs.version }}.tgz
            release-out/SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.verify-and-pack.outputs.release_tag }}"
          version="${{ needs.verify-and-pack.outputs.version }}"
          notes="Compiled-profile Better Auth adapter for RiffDB v${version} (pinned to RiffDB \`${{ needs.verify-and-pack.outputs.revision }}\` and \`@riffdb/client@${version}\`)."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-out/* --clobber
          else
            gh release create "$tag" release-out/* \
              --title "@riffdb/better-auth ${tag}" \
              --notes "$notes" \
              --verify-tag
          fi
      - name: Install Node.js for npm publication
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.7.0'
      - name: Publish to npm registry (when token or Trusted Publishing is configured)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tarball="./release-out/riffdb-better-auth-${{ needs.verify-and-pack.outputs.version }}.tgz"
          if [[ -n "${NPM_TOKEN:-}" ]]; then
            npmrc="$RUNNER_TEMP/.npmrc"
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >"$npmrc"
            chmod 0600 "$npmrc"
            npm publish "$tarball" --provenance --access public --ignore-scripts --userconfig "$npmrc"
          else
            npm install --global --no-fund --no-audit "npm@^11.5.1"
            npm publish "$tarball" --provenance --access public --ignore-scripts || {
              echo "::warning::npm OIDC Trusted Publishing or NPM_TOKEN is not yet configured for @riffdb/better-auth; GitHub Release tarball is published."
            }
          fi
